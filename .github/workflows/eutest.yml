name: Europatipset-test (tillfällig)
on:
  push:
    branches: [claude/project-thread-izb80s]
    paths: [".github/workflows/eutest.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SPEL: europatipset
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m stryktips hamta
      - run: python -m stryktips inbordes || true
      - run: python -m stryktips tabell || true
      - run: python -m stryktips forslag
      - run: ls -R forslag/europatipset data/raw/europatipset; head -c 600 forslag/europatipset/inbordes.json
      - run: SPEL= sh webb/bygg.sh && ls -R _site
      - run: curl -sS "https://stryktips-live.persandahl.workers.dev/?omgang=$(python -c 'import json;print(json.load(open("forslag/europatipset/senaste.json"))["omgang"])')&spel=europatipset" | head -c 300
